[package]
name = "brainstone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "durable", "ai", "async"]
categories = ["development-tools"]
description = "Durable AI agents in Rust: sessions, lanes, recovery, tools, and providers."

[features]
default = ["configured"]
configured = ["anthropic", "openai", "mcp", "memory", "policy", "skills", "subagents", "surface", "telemetry", "dep:serde", "dep:serde_json", "dep:reqwest", "dep:sha2", "dep:sigv4", "dep:rustls", "dep:toml", "dep:tokio", "dep:tracing"]
anthropic = ["dep:anthropic"]
openai = ["dep:openai"]
mcp = ["dep:mcp"]
memory = ["dep:memory"]
policy = ["dep:policy"]
skills = ["dep:skills"]
subagents = ["dep:subagents"]
surface = ["dep:surface"]
telemetry = ["dep:telemetry", "dep:tracing-subscriber"]

[dependencies]
telemetry = { path = "../telemetry", package = "brainstone-telemetry", version = "0.1.0", optional = true }
agent = { path = "../agent", package = "brainstone-agent", version = "0.1.0" }
anthropic = { path = "../anthropic", package = "brainstone-anthropic", version = "0.1.0", optional = true }
host = { path = "../host", package = "brainstone-host", version = "0.1.0" }
mcp = { path = "../mcp", package = "brainstone-mcp", version = "0.1.0", optional = true }
memory = { path = "../memory", package = "brainstone-memory", version = "0.1.0", optional = true }
openai = { path = "../openai", package = "brainstone-openai", version = "0.1.0", optional = true }
policy = { path = "../policy", package = "brainstone-policy", version = "0.1.0", optional = true }
media = { path = "../media", package = "brainstone-media", version = "0.1.0" }
runtime = { path = "../runtime", package = "brainstone-runtime", version = "0.1.0" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Endpoint validation and typed HTTP headers reuse the provider transport dependency.
reqwest = { workspace = true, optional = true }
# Stable replay identities must distinguish endpoint URLs without storing their secrets.
# Rejected: std hashes, whose algorithm is not stable across releases.
sha2 = { workspace = true, optional = true }
sigv4 = { path = "../sigv4", package = "brainstone-sigv4", version = "0.1.0", optional = true }
rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
skills = { path = "../skills", package = "brainstone-skills", version = "0.1.0", optional = true }
subagents = { path = "../subagents", package = "brainstone-subagents", version = "0.1.0", optional = true }
surface = { path = "../surface", package = "brainstone-surface", version = "0.1.0", optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
schemars.workspace = true
# Evaluation-only effect ledger reuses the runtime's SQLx dependency.
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread", "sync", "time", "process", "signal"] }

[lints]
workspace = true

[[test]]
name = "settings"
required-features = ["configured"]

[[test]]
name = "compatible_settings"
required-features = ["configured"]

[[test]]
name = "compose"
required-features = ["configured"]

[[example]]
name = "compose"
required-features = ["configured"]

[[test]]
name = "agent_examples"
required-features = ["openai"]

[[example]]
name = "chat"
required-features = ["openai"]

[[example]]
name = "order_support"
required-features = ["openai"]

[[example]]
name = "eval_sqlite"
required-features = ["openai"]

[[example]]
name = "refund"
path = "examples/refund.rs"

[[example]]
name = "coding_agent"
required-features = ["openai"]
