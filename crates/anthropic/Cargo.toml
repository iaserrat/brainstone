[package]
name = "brainstone-anthropic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["anthropic", "claude", "bedrock", "llm"]
categories = ["api-bindings"]
description = "Anthropic Messages and Amazon Bedrock model adapters."

[dependencies]
telemetry = { path = "../telemetry", package = "brainstone-telemetry", version = "0.1.0" }
agent = { path = "../agent", package = "brainstone-agent", version = "0.1.0" }
aws-sdk-bedrockruntime = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sigv4 = { path = "../sigv4", package = "brainstone-sigv4", version = "0.1.0" }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
aws-credential-types = { workspace = true, features = ["test-util"] }
aws-smithy-eventstream = { workspace = true }
aws-smithy-types = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }

[lints]
workspace = true
