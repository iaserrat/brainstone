[package]
name = "brainstone-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["telemetry", "opentelemetry", "tracing", "metrics"]
categories = ["development-tools::profiling"]
description = "OTLP traces, metrics, and correlated JSON logs."

[dependencies]
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }

[dev-dependencies]
opentelemetry-proto.workspace = true
prost.workspace = true
agent = { path = "../agent", package = "brainstone-agent", version = "0.1.0" }
runtime = { path = "../runtime", package = "brainstone-runtime", version = "0.1.0" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
