[package]
name = "brainstone-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["workers", "admission", "leases"]
categories = ["asynchronous", "concurrency"]
description = "Prompt admission, workers, and shutdown for accepted operations."

[dependencies]
agent = { path = "../agent", package = "brainstone-agent", version = "0.1.0" }
runtime = { path = "../runtime", package = "brainstone-runtime", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# Holds a table lock to stall the store in the opt-in Postgres regression test.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
