[package]
name = "brainstone-agent-rs-eval"
version = "0.0.0"
edition = "2024"
publish = false

# Keep comparison-only dependencies outside Brainstone's published workspace.
[workspace]

[dependencies]
agent-rs = "=0.1.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio-util = "0.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
