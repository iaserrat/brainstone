version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the AWS SDK, whose crates only build against each other.
      aws:
        patterns:
          - "aws-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
