name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories and dependency drift appear without a commit.
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Reads rust-toolchain.toml, so CI uses the pinned compiler.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gate

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The floor declared in [workspace.package].rust-version, not the pin.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # `rustup run` names the floor explicitly: the toolchain file would
      # otherwise win and this job would test the pinned compiler instead.
      - run: rustup run 1.95.0 cargo check --locked --workspace --all-targets

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brainstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BRAINSTONE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/brainstone
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      # The durability contract: the ignored tests that need a real database.
      - run: cargo xtask postgres-test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny,actionlint
      - run: cargo xtask audit
      - run: actionlint
